name: CI e imagem Docker
on:
  push:
    branches: [main]
    paths: ["app/**", "scripts/**", "tests/**", "requirements*.txt", "Dockerfile", "compose.yaml", "docker-compose.yml", ".github/workflows/docker.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: sal0-voz-release
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Preparar FFmpeg e voz de diagnóstico
        timeout-minutes: 6
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe || ! command -v espeak-ng; then
            sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1 update
            sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1 install -y --no-install-recommends ffmpeg espeak-ng
          fi
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: docker compose -f compose.yaml config -q && docker compose -f docker-compose.yml config -q
      - run: node --check app/static/app.js
      - name: Validar interface no navegador
        run: |
          npm install --prefix /tmp/sal0-browser playwright@1.55.0
          /tmp/sal0-browser/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/sal0-browser/node_modules node tests/browser_clone_flow.cjs
          NODE_PATH=/tmp/sal0-browser/node_modules node tests/browser_live_start.cjs
  docker:
    timeout-minutes: 45
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: |
            ghcr.io/sal0-apps/sal0-voz:0.3.7
            ghcr.io/sal0-apps/sal0-voz:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Testar imagem
        run: |
          docker run -d --name sal0-smoke --network none -e SAL0_AUTO_DOWNLOAD_MODELS=0 ghcr.io/sal0-apps/sal0-voz:latest
          for i in $(seq 1 30); do
            if docker exec sal0-smoke python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/health')"; then break; fi
            sleep 2
          done
          docker exec sal0-smoke python -m scripts.smoke
          docker exec sal0-smoke python -m scripts.check_engines
          docker exec sal0-smoke python -c "from pathlib import Path; status=Path('/proc/1/status').read_text(); assert any(x.startswith('Uid:\t1000') for x in status.splitlines()), status"
          docker stop sal0-smoke
      - name: Diagnostico em caso de falha
        if: failure()
        run: docker logs sal0-smoke || true
      - name: Publicar imagem versionada
        run: |
          docker push ghcr.io/sal0-apps/sal0-voz:0.3.7
          docker push ghcr.io/sal0-apps/sal0-voz:latest
          docker tag ghcr.io/sal0-apps/sal0-voz:0.3.7 ghcr.io/sal0-apps/sal0-voz:sha-${GITHUB_SHA}
          docker push ghcr.io/sal0-apps/sal0-voz:sha-${GITHUB_SHA}

