name: CI e imagem Docker
on:
  push:
    branches: [main]
    paths: ["app/**", "scripts/**", "tests/**", "requirements*.txt", "Dockerfile", "compose.yaml", "docker-compose.yml", ".github/workflows/docker.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: sal0-voz-release
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: docker compose -f compose.yaml config -q && docker compose -f docker-compose.yml config -q
      - run: node --check app/static/app.js
      - name: Validar interface no navegador
        run: |
          npm install --prefix /tmp/sal0-browser playwright@1.55.0
          /tmp/sal0-browser/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/sal0-browser/node_modules node tests/browser_clone_flow.cjs
          NODE_PATH=/tmp/sal0-browser/node_modules node tests/browser_live_start.cjs
  docker:
    timeout-minutes: 90
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: |
            ghcr.io/sal0-apps/sal0-voz:0.3.2
            ghcr.io/sal0-apps/sal0-voz:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Testar imagem
        run: |
          docker run -d --name sal0-smoke --network none -e SAL0_AUTO_DOWNLOAD_MODELS=0 ghcr.io/sal0-apps/sal0-voz:latest
          for i in $(seq 1 30); do
            if docker exec sal0-smoke python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/health')"; then break; fi
            sleep 2
          done
          docker exec sal0-smoke python -m scripts.smoke
          docker exec sal0-smoke /opt/engines/qwen/bin/python -c "from qwen_tts import Qwen3TTSModel; import torch; assert not torch.cuda.is_available()"
          docker exec sal0-smoke /opt/engines/whisper/bin/python -c "from faster_whisper import WhisperModel"
          docker exec sal0-smoke python -c "from pathlib import Path; status=Path('/proc/1/status').read_text(); assert any(x.startswith('Uid:\t1000') for x in status.splitlines()), status"
          docker stop sal0-smoke
      - name: Validar perfil padrao com quatro CPUs e 12 GiB offline
        run: |
          docker run -d --name sal0-default-smoke --cpus 4 --memory 12g --network none -e SAL0_AUTO_DOWNLOAD_MODELS=0 ghcr.io/sal0-apps/sal0-voz:latest
          for i in $(seq 1 30); do
            if docker exec sal0-default-smoke python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/health')"; then break; fi
            sleep 2
          done
          docker exec -e SAL0_SMOKE_CLONE_ENGINE=qwen-1.7b sal0-default-smoke python -m scripts.smoke_models
          docker stop sal0-default-smoke
      - name: Validar perfil leve completo offline
        run: |
          docker run -d --name sal0-model-smoke --cpus 4 --memory 12g --network none -e SAL0_AUTO_DOWNLOAD_MODELS=0 ghcr.io/sal0-apps/sal0-voz:latest
          for i in $(seq 1 30); do
            if docker exec sal0-model-smoke python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/health')"; then break; fi
            sleep 2
          done
          docker exec sal0-model-smoke python -m scripts.smoke_models
          docker stop sal0-model-smoke
      - name: Validar modelo 0.6B fixo com quatro CPUs, 4 GiB e AVX2 offline
        run: |
          docker run -d --name sal0-low-memory --cpus 4 --memory 4g --network none -e SAL0_AUTO_DOWNLOAD_MODELS=0 -e ATEN_CPU_CAPABILITY=avx2 -e ONEDNN_MAX_CPU_ISA=AVX2 ghcr.io/sal0-apps/sal0-voz:latest
          for i in $(seq 1 30); do
            if docker exec sal0-low-memory python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/health')"; then break; fi
            sleep 2
          done
          docker exec -e SAL0_SMOKE_CLONE_ENGINE=qwen-0.6b -e SAL0_SMOKE_EXPECT_DTYPE=bfloat16 sal0-low-memory python -m scripts.smoke_models
          docker stop sal0-low-memory
      - name: Validar Qwen 1.7B econômico com 10 GiB offline
        run: |
          docker run -d --name sal0-medium-memory --cpus 4 --memory 10g --network none -e SAL0_AUTO_DOWNLOAD_MODELS=0 ghcr.io/sal0-apps/sal0-voz:latest
          for i in $(seq 1 30); do
            if docker exec sal0-medium-memory python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/health')"; then break; fi
            sleep 2
          done
          docker exec -e SAL0_SMOKE_CLONE_ENGINE=qwen-1.7b -e SAL0_SMOKE_EXPECT_DTYPE=bfloat16 -e SAL0_SMOKE_EXPECT_ENGINE=qwen-1.7b sal0-medium-memory python -m scripts.smoke_models
          docker stop sal0-medium-memory
      - name: Diagnostico em caso de falha
        if: failure()
        run: |
          docker logs sal0-default-smoke || true
          docker exec sal0-default-smoke sh -c 'tail -n 60 /data/jobs/*/process.log' || true
          docker logs sal0-model-smoke || true
          docker exec sal0-model-smoke sh -c 'tail -n 60 /data/jobs/*/process.log' || true
          docker exec sal0-model-smoke sh -c 'tail -n 60 /data/models/*/download.log' || true
          docker logs sal0-low-memory || true
          docker exec sal0-low-memory sh -c 'tail -n 60 /data/jobs/*/process.log' || true
          docker logs sal0-medium-memory || true
          docker exec sal0-medium-memory sh -c 'tail -n 60 /data/jobs/*/process.log' || true
      - name: Publicar imagem versionada
        run: |
          docker push ghcr.io/sal0-apps/sal0-voz:0.3.2
          docker push ghcr.io/sal0-apps/sal0-voz:latest
          docker tag ghcr.io/sal0-apps/sal0-voz:0.3.2 ghcr.io/sal0-apps/sal0-voz:sha-${GITHUB_SHA}
          docker push ghcr.io/sal0-apps/sal0-voz:sha-${GITHUB_SHA}

