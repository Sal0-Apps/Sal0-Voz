name: Android APK
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sal0-voz-android
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Reutilizar assinatura do APK de instalação direta
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sal0-voz-android-install-signing-v1
      - name: Compilar e validar Android
        working-directory: android
        run: gradle --no-daemon :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease
      - name: Preparar APK e checksum
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Sal0-Voz-Android.apk
          cd dist
          sha256sum Sal0-Voz-Android.apk > Sal0-Voz-Android.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Sal0-Voz-Android
          path: dist/*
      - name: Publicar APK para instalação direta
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v0.3.1
          target_commitish: ${{ github.sha }}
          name: Sal0 Voz Android 0.3.1
          body: |
            App Android para acessar o seu servidor Sal0 Voz. Configure o endereço local (ex.: http://192.168.1.50:7886) e, opcionalmente, o endereço externo e o nome da rede Wi-Fi.

            Inclui sessão persistente, seleção de arquivos de áudio e vídeo e downloads. A geração continua no servidor quando o app é fechado. Android 8 ou posterior.

            APK para instalação direta, com assinatura de desenvolvimento, como o cliente Karaokê. Confira o checksum SHA-256 publicado junto do arquivo.
          files: dist/*
