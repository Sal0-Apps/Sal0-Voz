name: sal0-voz
services:
  sal0-voz:
    image: ghcr.io/sal0-apps/sal0-voz:latest
    build: .
    container_name: sal0-voz
    platform: linux/amd64
    init: true
    restart: unless-stopped
    ports:
      - "${SAL0_PORT:-7886}:7860"
    volumes:
      - ${SAL0_DATA_DIR:-./data}:/data
    environment:
      TZ: America/Sao_Paulo
      SAL0_DATA: /data
      SAL0_THREADS: "2"
      SAL0_MIN_FREE_MB: "512"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYANNOTE_METRICS_ENABLED: "0"
      SAL0_AUTO_DOWNLOAD_MODELS: "1"
      SAL0_AUTO_MODELS: "qwen-0.6b,whisper-medium"
    mem_limit: 10g
    cpus: 2
    stop_grace_period: 1m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/health',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
  model-setup:
    image: ghcr.io/sal0-apps/sal0-voz:latest
    build: .
    profiles: [setup]
    volumes:
      - ${SAL0_DATA_DIR:-./data}:/data
    environment:
      SAL0_DATA: /data
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
      HF_HUB_DISABLE_TELEMETRY: "1"
    entrypoint: ["/app/scripts/entrypoint.sh", "python", "-m", "scripts.models"]
    command: [list]
x-casaos:
  id: io.github.sal0-apps.sal0-voz
  main: sal0-voz
  author: Sal0
  developer: Sal0
  category: Media
  icon: https://raw.githubusercontent.com/Sal0-Apps/Sal0-Voz/main/app/static/icon-512.png
  title:
    en_US: Sal0 Voz
    pt_BR: Sal0 Voz
  tagline:
    en_US: Your local voice studio
    pt_BR: Seu estúdio de voz local
  description:
    en_US: Local characters, voice scripts, subtitles and dubbing with CPU processing.
    pt_BR: Personagens, roteiros, legendas e dublagem local com processamento em CPU.
  port_map: "7886"
  scheme: http
  index: /
  architectures: [amd64]
  version: "0.1.0"

